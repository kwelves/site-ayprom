# Background worker of the product photo queue. Started by the admin (workflow_dispatch API call) right after
# photos are queued; it makes the WebP copies and attaches the photos to their products, then stops.
# It never runs for pull requests or forks, so repository secrets are not exposed to outside code.
name: photo-queue

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Which site's photos to process
        type: choice
        options: [staging, production]
        default: staging
      # The admin starts this job with the environment only, so both inputs below default to the usual queue run.
      task:
        description: "queue: finish queued photos; regenerate-gallery: move existing photos to the current gallery profile"
        type: choice
        options: [queue, regenerate-gallery]
        default: queue
      apply:
        description: "regenerate-gallery only: write the new files and links (off = dry run, nothing is written)"
        type: boolean
        default: false
      limit:
        description: "regenerate-gallery only: at most this many photos (empty = all)"
        type: string
        default: ""

concurrency:
  group: photo-queue-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

permissions:
  contents: read
  # Lets this job start the publication workflow once photos are finished.
  actions: write

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: deploy/photo-queue
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Sharp
        working-directory: deploy/photo-queue
        run: npm install --omit=dev --no-audit --no-fund
      - name: Process queued photos
        working-directory: deploy/photo-queue
        # Inputs arrive as environment variables, never pasted into the script text.
        run: |
          args=()
          if [ "$TASK" = "regenerate-gallery" ]; then
            args+=(--regenerate-gallery)
            if [ "$APPLY" = "true" ]; then args+=(--apply); fi
            if [[ "$LIMIT" =~ ^[0-9]+$ ]]; then args+=("--limit=$LIMIT"); fi
          fi
          node runner.mjs "${args[@]}"
        env:
          TASK: ${{ inputs.task || 'queue' }}
          APPLY: ${{ inputs.apply }}
          LIMIT: ${{ inputs.limit }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MEDIA_STORAGE_WRITE_TARGET: ${{ vars.MEDIA_STORAGE_WRITE_TARGET }}
          NEXT_PUBLIC_MEDIA_BASE_URL: ${{ vars.NEXT_PUBLIC_MEDIA_BASE_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          # Writing to R2 needs the private journal bucket; the other two switches mirror the site's setting.
          MEDIA_STORAGE_JOURNAL_BUCKET: ${{ vars.MEDIA_STORAGE_JOURNAL_BUCKET }}
          MEDIA_STORAGE_DUAL_WRITE_SUPABASE: ${{ vars.MEDIA_STORAGE_DUAL_WRITE_SUPABASE }}
          MEDIA_STORAGE_RETAIN_OBJECTS: ${{ vars.MEDIA_STORAGE_RETAIN_OBJECTS }}
          GITHUB_DISPATCH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PUBLICATION_WORKFLOW_FILE: ${{ vars.PUBLICATION_WORKFLOW_FILE }}
          PUBLICATION_WORKFLOW_REF: ${{ vars.PUBLICATION_WORKFLOW_REF }}
          # The publication this job requests afterwards belongs to the same environment.
          WORKFLOW_ENVIRONMENT: ${{ inputs.environment || 'staging' }}
