name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Fails the build if a credential is committed. Runs first and independently
  # of `verify`, so a leak is reported even when tests are broken.
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # gitleaks needs history to scan past commits, not just the tip.
          fetch-depth: 0

      - name: Scan repository and history for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ github.token }}

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # Throwaway values for the ephemeral local Supabase started below — these
    # are NOT real credentials and must never be reused outside CI. Real
    # secrets belong in repository secrets, never inline here.
    env:
      ADMIN_PASSWORD: ci-only-admin-password
      ADMIN_SESSION_SECRET: ci-only-session-secret-with-at-least-32-bytes
      E2E_PORT: 3101
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3101

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.113.0
          github-token: ${{ github.token }}

      # Разворачивает базу с нуля из миграций. Именно этот шаг ловит миграцию,
      # которая не применяется на чистой базе, — целый класс дефектов, который
      # иначе всплывает только при восстановлении окружения.
      - name: Start local Supabase and apply migrations
        run: supabase start

      # QA-014: штатный проектный guard снимает public-схему локальной базы,
      # поднятой из миграций, и сопоставляет имена объектов с prod.sql.
      # Нельзя проверять текст `supabase db diff`: формат его вывода менялся,
      # а обычный diff сравнивает migrations с live DB, не декларативный файл.
      - name: Declarative schema matches migrations
        run: npm run schema:declarative

      # `supabase status -o env` quotes values (KEY="value") for shell sourcing,
      # but $GITHUB_ENV takes KEY=value literally — quotes included — so
      # NEXT_PUBLIC_SUPABASE_URL becomes the 25-char string "http://…" (with
      # literal quote characters) and next.config.ts's `new URL(...)` throws.
      # Strip the wrapping quotes before appending.
      - name: Export local Supabase environment
        run: |
          supabase status -o env \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY \
            --override-name auth.service_role_key=SUPABASE_SECRET_KEY \
            | sed -E 's/="(.*)"$/=\1/' \
            >> "$GITHUB_ENV"

      - name: Database integration and RLS tests
        run: supabase test db

      - name: Local API and Storage schema match migrations
        run: npm run schema:check

      - name: Lint, types, and unit tests
        run: npm run check

      - name: Production build
        run: npm run build

      - name: Install Playwright Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Browser smoke and regression baseline
        run: npm run e2e:ci

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-evidence-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/artifacts/
          if-no-files-found: warn
          retention-days: 14
